name: Market Hourly Tick

on:
  schedule:
    - cron: '0 * * * *'  # Cada hora en punto
  workflow_dispatch:      # También manual desde GitHub

jobs:
  market-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Run market_hourly_tick
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/market_hourly_tick" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "market_hourly_tick response: $RESPONSE"

      - name: Run decay_market_prices (each 6h)
        if: ${{ fromJson(format('"{0}"', github.run_attempt)) == '1' }}
        run: |
          HOUR=$(date +%-H)
          if [ $((HOUR % 6)) -eq 0 ]; then
            RESPONSE=$(curl -s -X POST \
              "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/decay_market_prices" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "decay_market_prices response: $RESPONSE"
          else
            echo "Skipping decay (hour $HOUR, not a multiple of 6)"
          fi