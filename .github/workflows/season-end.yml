name: Season End Check

on:
  schedule:
    - cron: '30 22 * * *'  # Cada día a las 22:30 UTC (00:30 Madrid)
  workflow_dispatch:

jobs:
  season-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check and close expired season
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/end_season_and_reward" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "end_season_and_reward response: $RESPONSE"

          SUCCESS=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success','false'))")
          if [ "$SUCCESS" = "True" ]; then
            echo "✅ Temporada cerrada y premios repartidos"
          else
            ERROR=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error','unknown'))")
            echo "ℹ️  $ERROR"
          fi