name: Beer League News Generator

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      block_type:
        description: 'morning o afternoon'
        default: 'morning'

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get market context
        id: market
        run: |
          CONTEXT=$(curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_market_context_for_news" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "context<<ENDOFCONTEXT" >> $GITHUB_OUTPUT
          echo "$CONTEXT" >> $GITHUB_OUTPUT
          echo "ENDOFCONTEXT" >> $GITHUB_OUTPUT

      - name: Determine block type
        id: blocktype
        run: |
          if [ -n "${{ github.event.inputs.block_type }}" ]; then
            echo "type=${{ github.event.inputs.block_type }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt "12" ]; then
              echo "type=morning" >> $GITHUB_OUTPUT
            else
              echo "type=afternoon" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate news with Claude Haiku
        id: news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOCK_TYPE: ${{ steps.blocktype.outputs.type }}
          MARKET_CONTEXT: ${{ steps.market.outputs.context }}
        run: python3 .github/scripts/generate_news_script.py

      - name: Save to Supabase
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/sb_resp.json -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/news_blocks" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data-raw "{\"block_type\": \"${{ steps.blocktype.outputs.type }}\", \"articles\": ${{ steps.news.outputs.articles }}, \"market_snapshot\": ${{ steps.market.outputs.context }}}")
          if [ "$HTTP_STATUS" = "201" ]; then
            echo "Bloque ${{ steps.blocktype.outputs.type }} guardado correctamente"
          else
            echo "Error HTTP $HTTP_STATUS"
            cat /tmp/sb_resp.json
            exit 1
          fi

      - name: Cleanup expired news
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/cleanup_expired_news" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'